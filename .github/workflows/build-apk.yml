name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'F10_DPF_Monitor_source (2).zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP file found in repository."
            exit 1
          fi
          mkdir -p app-source
          unzip -o "$ZIP_FILE" -d app-source
          echo "ZIP extracted from: $ZIP_FILE"
          find app-source -maxdepth 5 -type f | head -200

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find "$GITHUB_WORKSPACE/app-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            ROOT="$(find "$GITHUB_WORKSPACE/app-source" -type f \( -name build.gradle -o -name build.gradle.kts \) -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::The ZIP does not appear to contain an Android/Gradle project (no settings.gradle or build.gradle found)."
            echo "Please check the ZIP contents."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "::error::Gradle wrapper (gradlew) is missing. The project must include its wrapper."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F10-DPF-Monitor-debug-apk
          path: app-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
