name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'F10_DPF_Monitor_source (2).zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No source ZIP file found in repository."
            exit 1
          fi
          mkdir -p app-source
          unzip -o "$ZIP_FILE" -d app-source
          echo "ZIP extracted from: $ZIP_FILE"
          find app-source -maxdepth 5 -type f | head -200

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          ROOT_FILE="$(find "$GITHUB_WORKSPACE/app-source" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$ROOT_FILE" ]; then
            ROOT_FILE="$(find "$GITHUB_WORKSPACE/app-source" -type f -name settings.gradle -print -quit)"
          fi
          if [ -z "$ROOT_FILE" ]; then
            ROOT_FILE="$(find "$GITHUB_WORKSPACE/app-source" -type f -name build.gradle.kts -print -quit)"
          fi
          if [ -z "$ROOT_FILE" ]; then
            ROOT_FILE="$(find "$GITHUB_WORKSPACE/app-source" -type f -name build.gradle -print -quit)"
          fi
          if [ -z "$ROOT_FILE" ]; then
            echo "::error::The ZIP does not appear to contain an Android/Gradle project."
            exit 1
          fi
          ROOT="$(dirname "$ROOT_FILE")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.cwd() / "app-source"
          for path in root.rglob("build.gradle*"):
              text = path.read_text(errors="ignore")
              updated = re.sub(r"JavaVersion\\.VERSION_1_8", "JavaVersion.VERSION_17", text)
              updated = re.sub(r"VERSION_1_8", "VERSION_17", updated)
              if updated != text:
                  path.write_text(updated)
                  print(f"Aligned Java target in {path}")
          PY

      - name: Match Kotlin bytecode target to existing Java target
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$PROJECT_ROOT/app/build.gradle.kts" <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF


      - name: Patch ELM initialization and test ECU response
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['PROJECT_ROOT']) / 'app/src/main/java/pl/f10/dpfmonitor/MainActivity.kt'
          s = p.read_text()
          old = '''                output?.write("ATZ\\r".toByteArray(Charsets.US_ASCII))
                output?.flush()
                Thread.sleep(900)
                val buffer = ByteArray(512)
                val available = input?.available() ?: 0
                val reply = if (available > 0) { val count = input!!.read(buffer, 0, minOf(buffer.size, available)); String(buffer, 0, count, Charsets.US_ASCII).replace("\\r", " ").replace("\\n", " ").trim() } else "Adapter nie zwrócił jeszcze identyfikacji ELM"
                runOnUiThread {
                    vm.connected = true
                    vm.connecting = false
                    vm.lastResponse = reply.take(120)
                    vm.message = "Połączono z adapterem Bluetooth. Odczyt statusu DPF z BMW DDE nie jest jeszcze zaimplementowany — połączenie z adapterem nie oznacza odczytu ECU."
                }'''
          new = '''                fun command(cmd: String, waitMs: Long = 350): String {
                    val out = output ?: return ""
                    val inp = input ?: return ""
                    while (inp.available() > 0) inp.read(ByteArray(minOf(inp.available(), 512)))
                    out.write((cmd + "\\r").toByteArray(Charsets.US_ASCII)); out.flush()
                    Thread.sleep(waitMs)
                    val result = StringBuilder(); val buffer = ByteArray(256)
                    val deadline = System.currentTimeMillis() + 1200
                    while (System.currentTimeMillis() < deadline) {
                        val n = inp.available()
                        if (n > 0) { val count = inp.read(buffer, 0, minOf(n, buffer.size)); if (count > 0) result.append(String(buffer, 0, count, Charsets.US_ASCII)); if (result.contains(">")) break }
                        else Thread.sleep(40)
                    }
                    return result.toString().replace(">", "").replace("\\r", " ").replace("\\n", " ").trim()
                }
                command("ATZ", 1000); command("ATE0"); command("ATL0"); command("ATS0"); command("ATH1"); command("ATSP6")
                val ecuReply = command("0100", 700)
                runOnUiThread {
                    vm.connected = true; vm.connecting = false
                    vm.lastResponse = ecuReply.ifBlank { "Brak odpowiedzi na 0100" }.take(120)
                    vm.message = if (ecuReply.contains("41 00") || ecuReply.contains("4100")) "Adapter odpowiada na standardowe OBD-II. Parametry DPF BMW N47 wymagają odczytu specyficznych danych DDE; nie są zastępowane danymi ogólnymi." else "Bluetooth działa, ale sterownik nie potwierdził odpowiedzi na standardowe zapytanie 0100. Dane DPF DDE nie zostały odczytane."
                }'''
          if old not in s:
              raise SystemExit('Expected Bluetooth/ATZ block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          print('Patched ELM initialization and ECU probe')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F10-DPF-Monitor-debug-apk
          path: app-source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
